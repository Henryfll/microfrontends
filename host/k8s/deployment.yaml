apiVersion: apps/v1
kind: Deployment
metadata:
  name: host
  labels:
    app: host
    tier: shell
    framework: vanilla
    scenario: module-federation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: host
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: host
        tier: shell
        framework: vanilla
        scenario: module-federation
    spec:
      restartPolicy: Always
      containers:
        - name: host
          image: mf-host:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
