apiVersion: v1
kind: Service
metadata:
  name: host
  labels:
    app: host
    tier: shell
    framework: vanilla
    scenario: module-federation
spec:
  type: NodePort
  selector:
    app: host
  ports:
    - name: http
      protocol: TCP
      port: 4200
      targetPort: 4200
      nodePort: 30200
