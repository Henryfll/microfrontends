# SonarQube - configuracion estatica para root-config (host single-spa, SystemJS + Webpack 5)
# Quality Gate bloqueante: code smells, duplicacion, complejidad, maintainability.

sonar.projectKey=microfrontends_root-config_single-spa
sonar.projectName=root-config (single-spa host)
sonar.projectVersion=1.0.0

# Fuentes y exclusiones
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,scripts/**,webpack.config.js

# Lenguaje / encoding
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Metricas requeridas por el experimento:
#   - alert_status (quality gate)
#   - code_smells
#   - duplicated_lines_density
#   - sqale_rating (maintainability)
#   - complexity (ciclomatica)
#   - sqale_index
sonar.qualitygate.wait=true
