apiVersion: apps/v1
kind: Deployment
metadata:
  name: host
  namespace: single-spa-experiment
  labels:
    app: host
    orchestrator: single-spa
    experiment: microfrontend-study
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: host
      orchestrator: single-spa
      experiment: microfrontend-study
  template:
    metadata:
      labels:
        app: host
        orchestrator: single-spa
        experiment: microfrontend-study
    spec:
      restartPolicy: Always
      containers:
        - name: host
          image: mf-host:single-spa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 20
