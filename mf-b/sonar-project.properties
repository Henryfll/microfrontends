# SonarQube - configuracion estatica para mf-b (single-spa, React 19.2.0 + Webpack 5)
# Quality Gate bloqueante: code smells, duplicacion, complejidad, maintainability.

sonar.projectKey=microfrontends_mf-b_single-spa
sonar.projectName=mf-b (single-spa)
sonar.projectVersion=1.0.0

# Fuentes y exclusiones
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,scripts/**,public/**,webpack.config.js

# Lenguaje / encoding
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Metricas requeridas por el experimento:
#   - alert_status (quality gate)
#   - code_smells
#   - duplicated_lines_density
#   - sqale_rating (maintainability)
#   - complexity (ciclomatica)
#   - sqale_index
sonar.qualitygate.wait=true
