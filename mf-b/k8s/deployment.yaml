apiVersion: apps/v1
kind: Deployment
metadata:
  name: mf-b
  labels:
    app: mf-b
    tier: microfrontend
    framework: react
    scenario: module-federation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mf-b
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mf-b
        tier: microfrontend
        framework: react
        scenario: module-federation
    spec:
      restartPolicy: Always
      containers:
        - name: mf-b
          image: mf-b-mf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4202
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 4202
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 4202
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
